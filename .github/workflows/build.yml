name: Build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner'
        required: true
        type: string
        default: 'ubuntu-latest'
  schedule:
    - cron: '0 0 */16 * *'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      
      - name: Set ENV
        run: | 
          chmod +x *.sh
          echo "unix_time=$(date +%s)" >> $GITHUB_ENV
    
      - name: Create temporary test signing key
        run: |
          mkdir -p keys
          keytool -genkeypair -noprompt -keystore keys/test.jks -storepass testpass -keypass testpass -alias titanium-test -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Titanium Test Build"
          printf 'keyAlias=titanium-test\nkeyPassword=testpass\nstorePassword=testpass\n' > keys/local.properties
          echo "LOCAL_TEST_JKS=$(base64 -w0 keys/local.properties)" >> "$GITHUB_ENV"
          echo "STORE_TEST_JKS=$(base64 -w0 keys/test.jks)" >> "$GITHUB_ENV"

      - name: Build
        env:
            DEBIAN_FRONTEND: noninteractive
        run: |
          ./build.sh

      - name: Set
        run: |
          export VERSION=$(find chromium/src/out/release -name '*arm64-v8a.apk' | sed 's/.*\///;s/\-arm64-v8a.apk$//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mv $(find chromium/src/out/release -name '*arm64-v8a.aab') $VERSION-${{ env.unix_time }}-arm64-v8a.aab
          mv $(find chromium/src/out/release -name '*arm64-v8a.apk') $VERSION-${{ env.unix_time }}-arm64-v8a.apk
          mv $(find chromium/src/out/release -name '*armeabi-v7a.apk') $VERSION-${{ env.unix_time }}-armeabi-v7a.apk

      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: titanium-test-apks-${{ env.VERSION }}
          path: |
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk
            ${{ env.VERSION }}-${{ env.unix_time }}-armeabi-v7a.apk
